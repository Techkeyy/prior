[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior"
version = "0.1.0"
description = "Hire research agents that get better at specifying work after every job."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Techkeyy" }]
dependencies = [
  "sibyl-memory-client==0.8.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
acp = ["virtuals-acp"]
web3 = ["web3"]

[project.scripts]
prior = "prior.cli:main"
prior-doctor = "prior.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
